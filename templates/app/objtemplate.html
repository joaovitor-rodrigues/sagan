{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SAGAN — TIC {{ id }}</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="{% static 'app/fonts/css/fontawesome.css' %}" rel="stylesheet">
  <link href="{% static 'app/fonts/css/brands.css' %}" rel="stylesheet">
  <link href="{% static 'app/fonts/css/solid.css' %}" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'app/style.css' %}">
  <link rel="icon" type="image/png" href="{% static 'app/media/logo.png' %}">
</head>
<body>

<nav class="sagan-nav navbar navbar-expand-lg">
  <div class="container-fluid px-4">
    <div class="d-flex align-items-center gap-3">
      <a class="navbar-brand sagan-brand" href="{% url 'index' %}">SAGAN</a>
      <span class="sagan-obj-badge d-none d-sm-inline">
        <i class="fa-solid fa-star-of-life me-1" style="font-size:0.6rem;opacity:.7;"></i>TIC {{ id }}
      </span>
    </div>

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navContent" aria-controls="navContent" aria-expanded="false">
      <i class="fa-solid fa-bars"></i>
    </button>

    <div class="collapse navbar-collapse" id="navContent">
      <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-1 py-2 py-lg-0">
        <li class="nav-item">
          <a class="nav-link sagan-nav-link" href="{% url 'index' %}">Início</a>
        </li>
        <li class="nav-item">
          <a class="nav-link sagan-nav-link" href="{% url 'list' %}">Lista de Objetos</a>
        </li>
        <li class="nav-item">
          <a class="nav-link sagan-nav-link" href="{% url 'about' %}">Sobre</a>
        </li>
        <li class="nav-item ms-lg-2 mt-2 mt-lg-0">
          <a class="btn-github" href="https://github.com/joaovitor-rodrigues/sagan" target="_blank">
            <i class="fa-brands fa-github me-1"></i>GitHub
          </a>
        </li>
      </ul>
    </div>
  </div>
</nav>

<!-- Loading overlay for periodogram -->
<div class="loading-overlay" id="loadingOverlay">
  <div class="sagan-spinner"></div>
  <p>Calculando periodograma…</p>
  <small>Isso pode levar alguns segundos</small>
</div>

{% block content %}{% endblock %}

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://code.jquery.com/jquery-3.7.1.min.js" crossorigin="anonymous"></script>
{% block scripts %}{% endblock %}

<script>
  document.addEventListener('click', function (e) {
    var link = e.target.closest('a');
    if (link && link.href && (link.href.includes('/objeto/') || link.href.includes('to_periodogram'))) {
      document.getElementById('loadingOverlay').classList.add('active');
    }
  });
</script>
</body>
</html>
