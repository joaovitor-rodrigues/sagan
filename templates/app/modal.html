<div class="sagan-modal-backdrop open" id="obsBackdrop">
  <div class="sagan-modal">
    <div class="sagan-modal-header">
      <h5>
        <i class="fa-solid fa-satellite-dish me-2" style="color:var(--purple);font-size:.875rem;"></i>
        Observações do Objeto
      </h5>
      <button class="sagan-modal-close" onclick="closeModal()" aria-label="Fechar">
        <i class="fa-solid fa-xmark"></i>
      </button>
    </div>

    <div class="sagan-modal-body">
      {% if d %}
      <table class="obs-table">
        <thead>
          <tr>
            <th>#</th>
            <th>Missão</th>
            <th>Ano</th>
            <th>Autor</th>
            <th>TIC ID</th>
          </tr>
        </thead>
        <tbody>
          {% for obs in d %}
          <tr>
            <td>{{ forloop.counter0 }}</td>
            <td>
              <a href="{% url 'object' ticID=obs.tic_id ind=forloop.counter0 %}">
                {{ obs.mission }}
              </a>
            </td>
            <td>
              <a href="{% url 'object' ticID=obs.tic_id ind=forloop.counter0 %}">
                {{ obs.year }}
              </a>
            </td>
            <td>
              <a href="{% url 'object' ticID=obs.tic_id ind=forloop.counter0 %}">
                {{ obs.author }}
              </a>
            </td>
            <td>
              <a href="{% url 'object' ticID=obs.tic_id ind=forloop.counter0 %}">
                {{ obs.tic_id }}
              </a>
            </td>
          </tr>
          {% endfor %}
        </tbody>
      </table>
      {% else %}
      <div class="modal-loading">
        <i class="fa-solid fa-circle-exclamation" style="font-size:1.5rem; opacity:.4;"></i>
        <span>Nenhuma observação encontrada para este objeto.</span>
      </div>
      {% endif %}
    </div>
  </div>
</div>
