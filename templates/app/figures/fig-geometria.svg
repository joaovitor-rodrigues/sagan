<title id="fig-geometria-t">Geometria de um trânsito</title>
<desc id="fig-geometria-d">O planeta cruza o disco da estrela a uma distância b do centro. Os contatos I a IV marcam o início e o fim da entrada e da saída. Abaixo, a curva de luz alinhada: a queda δ, a duração total T14, o fundo T23 e a entrada τ.</desc>
