<svg class="sg-chart sg-diagram" id="fig-arquitetura" viewBox="0 0 720 300" role="img" aria-labelledby="fig-arquitetura-t fig-arquitetura-d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="fig-arquitetura-t">Arquitetura do SAGAN</title>
<desc id="fig-arquitetura-d">O navegador conversa com uma função Django na Vercel. A função busca o catálogo TOI no ExoFOP (com cache de uma hora) e as curvas de luz no MAST pelo lightkurve.</desc>
<defs><marker id="arr2" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" class="sg-arrowhead"/></marker></defs>
<rect class="sg-node" x="10" y="110" width="130" height="70" rx="10"/>
<text class="sg-node-t" x="75.0" y="142.0" text-anchor="middle">Navegador</text>
<text class="sg-node-s" x="75.0" y="158.0" text-anchor="middle">gráficos + pipeline</text>
<rect class="sg-node sg-node-accent" x="230" y="95" width="170" height="100" rx="10"/>
<text class="sg-node-t" x="315.0" y="142.0" text-anchor="middle">Django (Vercel)</text>
<text class="sg-node-s" x="315.0" y="158.0" text-anchor="middle">função Python stateless</text>
<rect class="sg-node" x="500" y="20" width="200" height="70" rx="10"/>
<text class="sg-node-t" x="600.0" y="52.0" text-anchor="middle">ExoFOP-TESS (IPAC)</text>
<text class="sg-node-s" x="600.0" y="68.0" text-anchor="middle">catálogo TOI · CSV</text>
<rect class="sg-node" x="500" y="200" width="200" height="70" rx="10"/>
<text class="sg-node-t" x="600.0" y="232.0" text-anchor="middle">MAST (STScI)</text>
<text class="sg-node-s" x="600.0" y="248.0" text-anchor="middle">curvas de luz · FITS</text>
<line class="sg-flow" x1="140" y1="135" x2="226" y2="135" marker-end="url(#arr2)"/>
<text class="sg-note" x="183.0" y="127.0" text-anchor="middle">páginas</text>
<line class="sg-flow" x1="226" y1="160" x2="144" y2="160" marker-end="url(#arr2)"/>
<text class="sg-note" x="185.0" y="176.0" text-anchor="middle">JSON</text>
<line class="sg-flow" x1="400" y1="120" x2="496" y2="60" marker-end="url(#arr2)"/>
<text class="sg-note" x="430" y="70" text-anchor="middle">cache 1 h</text>
<line class="sg-flow" x1="400" y1="170" x2="496" y2="232" marker-end="url(#arr2)"/>
<text class="sg-note" x="470" y="186" text-anchor="middle">lightkurve</text>
<text class="sg-note" x="10" y="232">O navegador guarda a lista de</text>
<text class="sg-note" x="10" y="248">funções aplicadas e a reenvia</text>
<text class="sg-note" x="10" y="264">a cada mudança; o servidor valida</text>
<text class="sg-note" x="10" y="280">e recalcula a partir da curva base.</text>
</svg>
