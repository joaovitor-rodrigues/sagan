<svg class="sg-chart sg-diagram" id="fig-pipeline" viewBox="0 0 720 250" role="img" aria-labelledby="fig-pipeline-t fig-pipeline-d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="fig-pipeline-t">Do pixel ao TOI</title>
<desc id="fig-pipeline-d">As câmeras do TESS geram imagens; os pipelines SPOC e QLP produzem curvas de luz e procuram eventos periódicos (TCEs); triagem automática e vetting humano promovem os melhores a TOI; o follow-up da comunidade confirma o planeta ou o marca como falso positivo.</desc>
<defs><marker id="arr2" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" class="sg-arrowhead"/></marker></defs>
<rect class="sg-node" x="10" y="30" width="120" height="58" rx="10"/>
<text class="sg-node-t" x="70.0" y="56.0" text-anchor="middle">Câmeras TESS</text>
<text class="sg-node-s" x="70.0" y="72.0" text-anchor="middle">2 min / 30 min</text>
<rect class="sg-node" x="152" y="30" width="120" height="58" rx="10"/>
<text class="sg-node-t" x="212.0" y="56.0" text-anchor="middle">Curvas de luz</text>
<text class="sg-node-s" x="212.0" y="72.0" text-anchor="middle">SPOC · QLP</text>
<rect class="sg-node" x="294" y="30" width="120" height="58" rx="10"/>
<text class="sg-node-t" x="354.0" y="56.0" text-anchor="middle">Busca de sinais</text>
<text class="sg-node-s" x="354.0" y="72.0" text-anchor="middle">TCEs (TPS · BLS)</text>
<rect class="sg-node" x="436" y="30" width="120" height="58" rx="10"/>
<text class="sg-node-t" x="496.0" y="56.0" text-anchor="middle">Triagem e vetting</text>
<text class="sg-node-s" x="496.0" y="72.0" text-anchor="middle">humanos + IA</text>
<rect class="sg-node sg-node-accent" x="578" y="30" width="120" height="58" rx="10"/>
<text class="sg-node-t" x="638.0" y="56.0" text-anchor="middle">TOI</text>
<text class="sg-node-s" x="638.0" y="72.0" text-anchor="middle">catálogo público</text>
<line class="sg-flow" x1="130" y1="59.0" x2="148" y2="59.0" marker-end="url(#arr2)"/>
<line class="sg-flow" x1="272" y1="59.0" x2="290" y2="59.0" marker-end="url(#arr2)"/>
<line class="sg-flow" x1="414" y1="59.0" x2="432" y2="59.0" marker-end="url(#arr2)"/>
<line class="sg-flow" x1="556" y1="59.0" x2="574" y2="59.0" marker-end="url(#arr2)"/>
<rect class="sg-node" x="578" y="150" width="120" height="58" rx="10"/>
<text class="sg-node-t" x="638.0" y="176.0" text-anchor="middle">Follow-up (TFOP)</text>
<text class="sg-node-s" x="638.0" y="192.0" text-anchor="middle">imagem · espectro · VR</text>
<line class="sg-flow" x1="638" y1="88" x2="638" y2="146" marker-end="url(#arr2)"/>
<rect class="sg-node sg-node-good" x="404" y="128" width="150" height="42" rx="10"/>
<text class="sg-node-t" x="479.0" y="146.0" text-anchor="middle">CP</text>
<text class="sg-node-s" x="479.0" y="162.0" text-anchor="middle">planeta confirmado</text>
<rect class="sg-node sg-node-bad" x="404" y="184" width="150" height="42" rx="10"/>
<text class="sg-node-t" x="479.0" y="202.0" text-anchor="middle">FP / FA</text>
<text class="sg-node-s" x="479.0" y="218.0" text-anchor="middle">falso positivo ou alarme</text>
<line class="sg-flow" x1="578" y1="166" x2="558" y2="152" marker-end="url(#arr2)"/>
<line class="sg-flow" x1="578" y1="192" x2="558" y2="204" marker-end="url(#arr2)"/>
<text class="sg-note" x="10" y="150">Sinais descartados no vetting (EB, V, IS)</text>
<text class="sg-note" x="10" y="166">não viram TOIs. Os que viram podem ser</text>
<text class="sg-note" x="10" y="182">reclassificados pelo follow-up.</text>
<text class="sg-note" x="10" y="198">Fluxo resumido de Guerrero et al. (2021).</text>
</svg>
